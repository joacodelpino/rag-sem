# Docker Compose levanta únicamente Qdrant. La app de Streamlit y la ingesta
# corren directo en Python en la máquina del desarrollador: así el modelo de
# embeddings se descarga una sola vez en el caché de HuggingFace del host y no
# hay que rebuildear una imagen cada vez que se toca una línea de código.
services:
  qdrant:
    # Versión fijada y alineada con el qdrant-client de requirements.txt: el
    # cliente avisa (y puede romper) si el major/minor del server no coincide.
    image: qdrant/qdrant:v1.19.0
    ports:
      - "6333:6333"   # HTTP / dashboard en http://localhost:6333/dashboard
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  qdrant_storage:
