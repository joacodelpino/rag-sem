services:
  qdrant:
    image: qdrant/qdrant:v1.11.4
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

  app:
    build: .
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./evals:/app/evals
    depends_on:
      - qdrant

volumes:
  qdrant_storage:
